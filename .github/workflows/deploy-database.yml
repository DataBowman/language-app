name: Deploy database

# Applies migrations and auth settings (supabase/config.toml, e.g. sign-up disabled) to the hosted project.
# Runs on every merge to main that changes supabase/, and on demand. CI has already run the migrations
# and access-rule tests against a scratch database before anything reaches main.
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-database
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'zppkafqzmamwnqozrchz' }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_30 || secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  # Email sending (Brevo SMTP), read by env(...) in supabase/config.toml.
  BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
  BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
  SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN_30 (or SUPABASE_ACCESS_TOKEN) and SUPABASE_DB_PASSWORD secrets (docs/OPERATIONS.md §2)."
            exit 1
          fi
          if [ -z "$BREVO_SMTP_LOGIN" ] || [ -z "$BREVO_SMTP_KEY" ] || [ -z "$SMTP_SENDER_EMAIL" ]; then
            echo "::error::Add the BREVO_SMTP_LOGIN, BREVO_SMTP_KEY and SMTP_SENDER_EMAIL secrets (docs/OPERATIONS.md §2.4)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Apply auth settings from config.toml
        run: |
          supabase config diff || true
          supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes
