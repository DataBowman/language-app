name: Monthly restore test

# Restores the latest backup into a throwaway database and runs sanity checks (ADR 0005).
# A failure here means backups cannot be trusted — treat it as urgent.
on:
  schedule:
    - cron: "43 5 2 * *" # 05:43 UTC on the 2nd of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$BACKUP_S3_BUCKET" ]; then
            echo "::notice::Backup secrets not configured yet — skipping (see docs/OPERATIONS.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.cfg.outputs.configured == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.configured == 'true'
        with:
          version: 2.118.0
      - name: Install rclone and psql
        if: steps.cfg.outputs.configured == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q rclone postgresql-client
      - name: Restore and verify
        if: steps.cfg.outputs.configured == 'true'
        run: bash tools/backup/restore-test.sh
